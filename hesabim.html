<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fibomobiliare - Hesabım</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
    }

    header {
      display: flex;
      height: 120px;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background-color: #f5f5f5;
      border-bottom: 2px solid mediumslateblue;
    }

    .logo img {
      width: 250px;
      height: auto;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-name {
      font-size: 16px;
      color: #333;
    }

    .user-avatar {
      width: 60px;
      height: 60px;
      border: 2px solid #007bff;
      border-radius: 100%;
      overflow: hidden;
    }

    .user-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 100%;
    }

    .account-container {
      max-width: 600px;
      margin: 30px auto;
      padding: 25px;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }

    h4 {
      margin-bottom: 20px;
      text-align: center;
    }

    .form-control {
      margin-bottom: 15px;
    }

    .btn-update, .btn-logout {
      background-color: #28a745;
      color: white;
      width: 100%;
      padding: 12px;
      border: none;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .btn-update:hover, .btn-logout:hover {
      background-color: #218838;
    }

    .btn-logout {
      background-color: #dc3545;
    }

    .btn-logout:hover {
      background-color: #c82333;
    }

    #update-success-message, #update-error-message {
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <a href="index.html">
        <img src="/images/logo_-removebg-preview.png" alt="Logo" />
      </a>
    </div>
    <div class="user-profile">
      <div class="user-name" id="user-name">Misafir</div>
      <div class="user-avatar">
        <a href="giris-yap.html">
          <img src="/images/profile.png" alt="Profil" />
        </a>
      </div>
    </div>
  </header>

  <div class="account-container">
    <h4>Hesabım</h4>
    <form id="updateForm">
      <div class="mb-3">
        <label for="new-username" class="form-label">Yeni Kullanıcı Adı</label>
        <input type="text" class="form-control" id="new-username" placeholder="Yeni kullanıcı adınızı girin" />
      </div>
      <div class="mb-3">
        <label for="new-password" class="form-label">Yeni Şifre</label>
        <input type="password" class="form-control" id="new-password" placeholder="Yeni şifrenizi girin" />
      </div>
      <button type="submit" class="btn-update">Güncelle</button>
    </form>
    <div id="update-success-message" style="color: green; display: none;">Hesap başarıyla güncellendi!</div>
    <div id="update-error-message" style="color: red; display: none;">Bir hata oluştu. Lütfen tekrar deneyin.</div>

    <button class="btn-logout" id="logoutButton">Çıkış Yap</button>
  </div>

  <script>
    window.onload = function() {
      const isLoggedIn = localStorage.getItem("isLoggedIn");
      const userNameElement = document.getElementById("user-name");

      if (isLoggedIn === "true") {
        const username = localStorage.getItem("username");
        userNameElement.textContent = username;
      } else {
        userNameElement.textContent = "Misafir";
      }
    };

    document.getElementById("updateForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const newUsername = document.getElementById("new-username").value.trim();
      const newPassword = document.getElementById("new-password").value.trim();
      const successMessage = document.getElementById("update-success-message");
      const errorMessage = document.getElementById("update-error-message");

      const currentUsername = localStorage.getItem("username");
      const existingUsers = JSON.parse(localStorage.getItem("users")) || [];
      const userIndex = existingUsers.findIndex(u => u.kullaniciAdi === currentUsername);

      if (userIndex !== -1) {
        existingUsers.splice(userIndex, 1);

        const updatedUser = {
          kullaniciAdi: newUsername,
          sifre: newPassword
        };
        existingUsers.push(updatedUser);

        localStorage.setItem("users", JSON.stringify(existingUsers));

        localStorage.setItem("username", newUsername);
        localStorage.setItem("isLoggedIn", "true");

        successMessage.style.display = "block";
        errorMessage.style.display = "none";
        setTimeout(function() {
          window.location.href = "index.html";
        }, 1000);
      } else {
        successMessage.style.display = "none";
        errorMessage.style.display = "block";
      }
    });

    document.getElementById("logoutButton").addEventListener("click", function() {
      localStorage.removeItem("isLoggedIn");
      localStorage.removeItem("username");
      window.location.href = "giris-yap.html";
    });
  </script>

</body>
</html>
