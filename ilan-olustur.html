<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fibomobiliare - İlan Oluştur</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      height: 120px;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background-color: #f5f5f5;
      border-bottom: 2px solid mediumslateblue;
    }

    .logo img {
      width: 300px;
      height: auto;
    }

    .search-container {
      display: flex;
      align-items: center;
      position: relative;
      right: 450px;
    }

    .search-container input {
      height: 40px;
      width: 250px;
      padding-right: 10px;
    }

    .search-btn {
      height: 40px;
      margin-left: -50px;
      opacity: 0;
      transform: translateX(-20px) scaleX(0.3);
      transition: all 0.4s ease;
      z-index: 1;
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
    }

    .search-container:hover .search-btn {
      opacity: 1;
      transform: translateX(0) scaleX(1);
      margin-left: 0;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-name {
      font-size: 16px;
      color: #333;
    }

    .user-avatar {
      width: 60px;
      height: 60px;
      border: 2px solid #007bff;
      border-radius: 100%;
      overflow: hidden;
    }

    .user-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .form-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0f0f0;
      padding: 40px 20px;
    }

    .form-container {
      background-color: #fff;
      padding: 30px;
      border-radius: 10px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .form-container h3 {
      margin-bottom: 20px;
      text-align: center;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <a href="index.html">
        <img src="/images/logo_-removebg-preview.png" alt="Logo" />
      </a>
    </div>

    <div class="right-section" style="display: flex; align-items: center; gap: 40px; flex: 1; justify-content: flex-end;">
      <div class="search-container">
        <input type="text" class="form-control" id="search-input" placeholder="İlan Ara..." />
        <button class="btn btn-primary search-btn">Ara</button>
      </div>

      <button class="btn btn-primary ilan-olustur-btn" onclick="window.location.href='ilan-olustur.html'" style="height: 40px;">
        İlan Oluştur
      </button>

      <div class="user-profile">
        <div class="user-name" id="user-name">Misafir</div>
        <div class="user-avatar">
          <a id="profileLink" href="giris-yap.html">
            <img src="/images/profile.png" alt="Profil" />
          </a>
      </div>
  </header>

  <div class="form-wrapper">
    <div class="form-container">
      <h3>Yeni İlan Oluştur</h3>
      <form id="ilan-form">
        <div class="mb-3">
          <label for="main-category" class="form-label">İlan Türü (Ana Kategori)</label>
          <select class="form-select" id="main-category" onchange="showSubCategories()">
            <option selected disabled>Kategori Seçiniz</option>
            <option value="Emlak">Emlak</option>
            <option value="Otomobil">Otomobil</option>
            <option value="Ev Eşyaları">Ev Eşyaları</option>
          </select>
        </div>

        <div class="mb-3 hidden" id="subcategory-container">
          <label for="sub-category" class="form-label">Alt Kategori</label>
          <select class="form-select" id="sub-category" onchange="showFormFields()">
            <!-- JS ile doldurulacak -->
          </select>
        </div>

        <div id="extra-fields" class="hidden">
          <div class="mb-3">
            <label for="image" class="form-label">İlan Resmi</label>
            <input type="file" class="form-control" id="image" />
          </div>

          <div class="mb-3">
            <label for="title" class="form-label">İlan Adı</label>
            <input type="text" class="form-control" id="title" placeholder="İlan başlığı girin..." />
          </div>

          <div class="mb-3">
            <label for="details" class="form-label">Detaylar</label>
            <textarea class="form-control" id="details" rows="4" placeholder="İlan detaylarını yazın..."></textarea>
          </div>

          <div class="mb-3">
            <label for="price" class="form-label">Fiyat (TL)</label>
            <input type="number" class="form-control" id="price" placeholder="Fiyat girin..." />
          </div>

          <button type="submit" class="btn btn-success w-100">İlanı Yayınla</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    if (!localStorage.getItem("veriYuklendi")) {
      fetch("ilanlar.json")
        .then(res => res.json())
        .then(data => {
          localStorage.setItem("ilanlar", JSON.stringify(data));
          localStorage.setItem("veriYuklendi", "true");

          if (!localStorage.getItem("ilanSayisi")) {
            localStorage.setItem("ilanSayisi", "21");
          }
        });
    }

    const subCategories = {
      "Emlak": ["Daire", "Dükkan"],
      "Otomobil": ["Sedan", "Hatchback", "SUV"],
      "Ev Eşyaları": ["Hırdavat", "2. El", "Elektronik"]
    };

    function showSubCategories() {
      const mainCategory = document.getElementById("main-category").value;
      const subCategorySelect = document.getElementById("sub-category");
      const subContainer = document.getElementById("subcategory-container");
      const extraFields = document.getElementById("extra-fields");

      subContainer.classList.remove("hidden");
      extraFields.classList.add("hidden");

      subCategorySelect.innerHTML = "<option selected disabled>Alt Kategori Seçiniz</option>";
      subCategories[mainCategory].forEach(sub => {
        const option = document.createElement("option");
        option.value = sub;
        option.textContent = sub;
        subCategorySelect.appendChild(option);
      });
    }

    function showFormFields() {
      const extraFields = document.getElementById("extra-fields");
      extraFields.classList.remove("hidden");
    }

    function getNextId() {
      let currentId = parseInt(localStorage.getItem("ilanSayisi") || "21");
      localStorage.setItem("ilanSayisi", (currentId + 1).toString());
      return currentId;
    }

    document.getElementById("ilan-form").addEventListener("submit", function(e) {
      e.preventDefault();

      const ilanAdi = document.getElementById("title").value;
      const detaylar = document.getElementById("details").value;
      const price = document.getElementById("price").value;
      const imageFile = document.getElementById("image").files[0];
      const ilanTarihi = new Date().toISOString().split('T')[0];

      const saveIlan = (imageData = "") => {
        const ilanData = {
          id: getNextId(),
          kategori: document.getElementById("main-category").value,
          altKategori: document.getElementById("sub-category").value,
          ilanAdi: ilanAdi,
          metrekare: null,
          il: "",
          fiyat: parseFloat(price),
          resim: imageData || "",
          detaylar: detaylar,
          ilanTarihi: ilanTarihi,
          saticiAd: "",
          saticiSoyad: "",
          saticiTelefon: "",
          saticiEmail: "",
          saticiAdres: "",
          saticiTarih: ""
        };

        const ilanlar = JSON.parse(localStorage.getItem("ilanlar")) || [];
        ilanlar.push(ilanData);
        localStorage.setItem("ilanlar", JSON.stringify(ilanlar));

        document.getElementById("ilan-form").reset();
        alert("İlan başarıyla oluşturuldu!");
      };

      if (imageFile) {
        const reader = new FileReader();
        reader.onload = function(event) {
          saveIlan(event.target.result);
        };
        reader.readAsDataURL(imageFile);
      } else {
        saveIlan("");
      }
    });

    window.onload = function () {
      const isLoggedIn = localStorage.getItem("isLoggedIn");
      const userNameElement = document.getElementById("user-name");
      const profileLink = document.getElementById("profileLink");

      if (isLoggedIn === "true") {
        const username = localStorage.getItem("username");
        if (username) {
          userNameElement.textContent = username;
          profileLink.href = "hesabim.html";
        } else {
          userNameElement.textContent = "Misafir";
          profileLink.href = "giris-yap.html";
        }
      } else {
        userNameElement.textContent = "Misafir";
        profileLink.href = "giris-yap.html";
      }
    };
  </script>
</body>
</html>
