<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fibomobiliare-Giriş Yap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
    }

    header {
      display: flex;
      height: 120px;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background-color: #f5f5f5;
      border-bottom: 2px solid mediumslateblue;
    }

    .logo img {
      width: 300px;
      height: auto;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-name {
      font-size: 16px;
      color: #333;
    }

    .user-avatar {
      width: 60px;
      height: 60px;
      border: 2px solid #007bff;
      border-radius: 100%;
      overflow: hidden;
    }

    .user-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 100%;
    }

    .login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f8f9fa;
    }

    .login-card {
      width: 100%;
      max-width: 500px;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      background-color: white;
    }

    .btn-login {
      background-color: white;
      color: #28a745;
      border: 2px solid #28a745;
      transition: all 0.3s ease;
      width: 48%;
    }

    .btn-login:hover {
      background-color: #28a745;
      color: white;
    }

    .btn-register {
      background-color: white;
      color: #0056b3;
      border: 2px solid #0056b3;
      transition: all 0.3s ease;
      text-decoration: none;
      width: 48%;
    }

    .btn-register:hover {
      background-color: #0056b3;
      color: white;
    }

    @media (max-width: 768px) {
      header {
        flex-direction: column;
        height: auto;
        padding: 10px 15px;
      }

      .logo img {
        display: none;
      }

      .user-profile {
        margin-top: 10px;
        display: flex;
        justify-content: space-between;
        width: 100%;
        gap: 0px;
      }

      .user-name {
        margin-right: 10px;
      }

      .user-avatar {
        cursor: pointer;
      }

      .btn-login, .btn-register {
        width: 100%;
        margin-bottom: 10px;
      }
    }

  </style>
</head>
<body>

  <header>
    <div class="logo">
      <a href="anasayfa.html">
        <img src="/images/logo_-removebg-preview.png" alt="Logo" />
      </a>
    </div>
    <div class="user-profile">
      <div class="user-name" id="user-name">Misafir</div>
      <div class="user-avatar">
        <a href="giris-yap.html">
          <img src="/images/profile.png" alt="Profil" />
        </a>
      </div>
    </div>
  </header>

  <div class="login-container">
    <div class="login-card">
      <h4 class="mb-4 text-center">Giriş Yap</h4>
      <form id="loginForm">
        <div class="mb-3">
          <label for="username" class="form-label">Kullanıcı Adı</label>
          <input type="text" class="form-control" id="username" placeholder="Kullanıcı adınızı girin" />
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Şifre</label>
          <input type="password" class="form-control" id="password" placeholder="Şifrenizi girin" />
        </div>
        <div id="error-message" style="color: red; display: none;">Kullanıcı adı veya şifre hatalı.</div>
        <div id="success-message" style="color: green; display: none;">Giriş başarılı!</div>
        <div class="d-flex justify-content-between">
          <a href="uye-ol.html" class="btn btn-register">Üye Ol</a>
          <button type="submit" class="btn btn-login">Giriş Yap</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorMessage = document.getElementById("error-message");
      const successMessage = document.getElementById("success-message");

      const existingUsers = JSON.parse(localStorage.getItem("users")) || [];
      const user = existingUsers.find(u => u.kullaniciAdi === username);

      if (user && user.sifre === password) {
        successMessage.style.display = "block";
        errorMessage.style.display = "none";

        localStorage.setItem("isLoggedIn", "true");
        localStorage.setItem("username", username); 

        setTimeout(function() {
          window.location.href = "hesabim.html";
        }, 1000);
      } else {
        errorMessage.style.display = "block";
        successMessage.style.display = "none";
      }
    });

    window.onload = function() {
      const isLoggedIn = localStorage.getItem("isLoggedIn");
      const userNameElement = document.getElementById("user-name");

      if (isLoggedIn === "true") {
        const username = localStorage.getItem("username");
        userNameElement.textContent = username;
      } else {
        userNameElement.textContent = "Misafir";
      }
    };
  </script>

</body>
</html>
