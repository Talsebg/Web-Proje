<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fibomobiliare - Üye Ol</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }

    header {
      display: flex;
      height: 120px;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background-color: #f5f5f5;
      border-bottom: 2px solid mediumslateblue;
    }

    .logo img {
      width: 300px;
      height: auto;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-name {
      font-size: 16px;
      color: #333;
    }

    .user-avatar {
      width: 60px;
      height: 60px;
      border: 2px solid #007bff;
      border-radius: 100%;
      overflow: hidden;
    }

    .user-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .search-container {
      display: flex;
      align-items: center;
      position: relative;
      right: 450px;
    }

    .search-container input {
      height: 40px;
      padding-right: 10px;
      width: 250px;
    }

    .search-btn {
      height: 40px;
      margin-left: -50px;
      padding: 0 10px;
      opacity: 0;
      transform: translateX(-20px) scaleX(0.3);
      transition: all 0.4s ease;
      z-index: 1;
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
    }

    .search-container:hover .search-btn {
      opacity: 1;
      transform: translateX(0) scaleX(1);
      margin-left: 0;
    }

    .register-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .register-card {
      width: 100%;
      max-width: 500px;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      background-color: white;
    }

    .btn-register {
      background-color: white;
      color: #28a745;
      border: 2px solid #28a745;
      transition: all 0.3s ease;
    }

    .btn-register:hover {
      background-color: #28a745;
      color: white;
    }

    .btn-login {
      background-color: white;
      color: #0056b3;
      border: 2px solid #0056b3;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .btn-login:hover {
      background-color: #0056b3;
      color: white;
    }

    @media (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: flex-start;
        height: auto;
      }

      .logo img {
        width: 200px;
      }

      .search-container {
        position: static;
        width: 100%;
        margin-top: 10px;
      }

      .search-container input {
        width: 100%;
        margin-bottom: 10px;
      }

      .search-btn {
        width: 100%;
        margin-top: 5px;
      }

      .register-container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <a href="anasayfa.html">
        <img src="/images/logo_-removebg-preview.png" alt="Logo" />
      </a>
    </div>

    <div class="right-section" style="display: flex; align-items: center; gap: 40px; flex: 1; justify-content: flex-end;">
      <div class="search-container">
        <input type="text" class="form-control" id="search-input" placeholder="İlan Ara..." onkeydown="handleEnter(event)" />
        <button class="btn btn-primary search-btn" onclick="searchListings()">Ara</button>
      </div>

      <button class="btn btn-primary ilan-olustur-btn" onclick="window.location.href='ilan-olustur.html'" style="height: 40px;">
        İlan Oluştur
      </button>

      <div class="user-profile">
        <div class="user-name">Misafir</div>
        <div class="user-avatar">
          <a href="giris-yap.html">
            <img src="/images/profile.png" alt="Profil" />
          </a>
        </div>
      </div>
    </div>
  </header>
  <div class="register-container">
    <div class="register-card">
      <h4 class="mb-4 text-center">Üye Ol</h4>
      <form id="registerForm">
        <div class="mb-3">
          <label for="username" class="form-label">Kullanıcı Adı</label>
          <input type="text" class="form-control" id="username" placeholder="Kullanıcı adınızı girin" required />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Şifre</label>
          <input type="password" class="form-control" id="password" placeholder="Şifrenizi girin" required />
        </div>
        <div class="mb-3">
          <label for="name" class="form-label">Ad</label>
          <input type="text" class="form-control" id="name" placeholder="Adınızı girin" required />
        </div>
        <div class="mb-3">
          <label for="surname" class="form-label">Soyad</label>
          <input type="text" class="form-control" id="surname" placeholder="Soyadınızı girin" required />
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">E-posta</label>
          <input type="email" class="form-control" id="email" placeholder="ornek@mail.com" required />
        </div>
        <div class="mb-3">
          <label for="phone" class="form-label">Telefon</label>
          <input type="tel" class="form-control" id="phone" placeholder="0555 555 55 55" required />
        </div>
        <div class="mb-4">
          <label for="address" class="form-label">Adres</label>
          <textarea class="form-control" id="address" rows="2" placeholder="Adresinizi girin" required></textarea>
        </div>
        <div class="d-flex justify-content-between">
          <button type="submit" class="btn btn-register">Kayıt Ol</button>
          <a href="giris-yap.html" class="btn btn-login">Giriş Yap</a>
        </div>
        <div id="message" class="mt-3 text-success d-none">Kayıt başarılı! Giriş yapabilirsiniz.</div>
      </form>
    </div>
  </div>

  <script>
    function searchListings() {
      const searchTerm = document.getElementById("search-input").value.trim().toLowerCase();
      if (searchTerm.length < 3) {
        alert("En az 3 karakter girin.");
        return;
      }
      window.location.href = "anasayfa.html?search=" + encodeURIComponent(searchTerm);
    }

    function handleEnter(event) {
      if (event.key === 'Enter') {
        searchListings();
      }
    }

    document.getElementById("registerForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const name = document.getElementById("name").value.trim();
      const surname = document.getElementById("surname").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const address = document.getElementById("address").value.trim();

      if (!username || !password || !name || !surname || !email || !phone || !address) {
        alert("Lütfen tüm alanları doldurduğunuzdan emin olun.");
        return;
      }

      const newUser = {
        kullaniciAdi: username,
        sifre: password,
        ad: name,
        soyad: surname,
        email: email,
        telefon: phone,
        adres: address
      };

      const existingUsers = JSON.parse(localStorage.getItem("users")) || [];
      existingUsers.push(newUser);
      localStorage.setItem("users", JSON.stringify(existingUsers));

      document.getElementById("message").classList.remove("d-none");
      document.getElementById("registerForm").reset();
    });
  </script>

</body>
</html>
