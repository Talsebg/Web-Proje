<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fibomobiliare-Anasayfa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; }
    header { display: flex; height: 120px; justify-content: space-between; align-items: center; padding: 15px 30px; background-color: #f5f5f5; border-bottom: 2px solid mediumslateblue; }
    .logo img { width: 300px; height: auto; }
    .right-section { display: flex; align-items: center; gap: 40px; flex: 1; justify-content: flex-end; }
    .search-container { display: flex; align-items: center; position: relative; right: 450px; }
    .search-container input { height: 40px; width: 250px; padding-right: 10px; }
    .search-btn { height: 40px; margin-left: -50px; opacity: 0; transform: translateX(-20px) scaleX(0.3); transition: all 0.4s ease; z-index: 1; border-top-left-radius: 0; border-bottom-left-radius: 0; }
    .search-container:hover .search-btn { opacity: 1; transform: translateX(0) scaleX(1); margin-left: 0; }
    .user-profile { display: flex; align-items: center; gap: 10px; }
    .user-name { font-size: 16px; color: #333; }
    .user-avatar { width: 60px; height: 60px; border: 2px solid #007bff; border-radius: 100%; overflow: hidden; }
    .user-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 100%; }
    .category-container { display: flex; flex: 1; height: calc(100vh - 120px); }
    .category-list { flex: 0 0 250px; background-color: #f5f5f5; padding: 20px; cursor: pointer; overflow-y: auto; }
    .category-list ul { list-style-type: none; padding-left: 10px; }
    .category-list li { font-size: 20px; color: #8e8e8e; margin-bottom: 10px; padding-left: 5px; transition: all 0.3s ease; }
    .category-list li:hover { color: #0056b3; }
    .category-list li ul li { font-size: 16px; color: #a3a3a3; margin-top: 5px; padding-left: 15px; }
    .category-list li ul li:hover { color: #007bff; }
    .category-divider { width: 5px; background-color: rgba(128, 128, 128, 0.2); margin-left: 20px; }
    .category-content { flex: 1; padding: 20px; background-color: #fafafa; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 20px; }
    .ilan { display: flex; background-color: white; border: 1px solid #ccc; border-radius: 8px; padding: 10px; width: 280px; height: 450px; flex-direction: column; text-align: center; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); justify-content: space-between; }
    .ilan-card { display: flex; flex-direction: column; align-items: center; width: 100%; height: 100%; }
    .ilan-image { width: 100%; height: 200px; object-fit: cover; border-radius: 5px; margin-bottom: 10px; }
    .ilan-bilgi { display: flex; flex-direction: column; align-items: center; justify-content: space-between; flex: 1; }
    .ilan-bilgi h3 { margin-bottom: 10px; font-size: 18px; color: #333; }
    .ilan-bilgi p { margin: 5px 0; font-size: 14px; color: #555; }
    .listing-price { color: #28a745; font-weight: bold; font-size: 16px; margin: 10px 0; }
    .detay-btn { background-color: #007bff; color: white; padding: 10px 20px; font-size: 14px; border: none; border-radius: 5px; cursor: pointer; width: 150px; align-self: center; }
    .detay-btn:hover { background-color: #0056b3; }
    .error-message { color: red; font-size: 14px; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: #f8d7da; padding: 10px 20px; border-radius: 5px; text-align: center; display: none; opacity: 0; z-index: 10; width: 300px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <a href="anasayfa.html">
        <img src="/images/logo_-removebg-preview.png" alt="Logo" />
      </a>
    </div>
    <div class="right-section">
      <div class="search-container">
        <input type="text" class="form-control" id="search-input" placeholder="İlan Ara..." onkeydown="handleEnter(event)" />
        <button class="btn btn-primary search-btn" onclick="searchListings()">Ara</button>
      </div>
      <button class="btn btn-primary ilan-olustur-btn" onclick="window.location.href='ilan-olustur.html'" style="height: 40px;">
        İlan Oluştur
      </button>
      <div class="user-profile">
        <div id="user-name" class="user-name">Misafir</div>
        <div class="user-avatar">
          <a href="#" id="profile-link">
            <img src="/images/profile.png" alt="Profil" />
          </a>
        </div>
      </div>
    </div>
  </header>

  <div id="error-message" class="error-message">En az 3 karakter girin!</div>

  <div class="category-container">
    <div class="category-list" tabindex="0" id="category-list">
      <ul>
        <li onclick="filterCategory('Emlak')">Emlak
          <ul>
            <li onclick="filterSubCategory('Dükkan', event)">Dükkan</li>
            <li onclick="filterSubCategory('Daire', event)">Daire</li>
          </ul>
        </li>
        <li onclick="filterCategory('Otomobil')">Otomobil
          <ul>
            <li onclick="filterSubCategory('Sedan', event)">Sedan</li>
            <li onclick="filterSubCategory('Hatchback', event)">Hatchback</li>
            <li onclick="filterSubCategory('SUV', event)">SUV</li>
          </ul>
        </li>
        <li onclick="filterCategory('Ev Eşyaları')">Ev Eşyaları
          <ul>
            <li onclick="filterSubCategory('Hırdavat', event)">Hırdavat</li>
            <li onclick="filterSubCategory('2. El', event)">2. El</li>
            <li onclick="filterSubCategory('Elektronik', event)">Elektronik</li>
          </ul>
        </li>
      </ul>
    </div>
    <div class="category-divider"></div>
    <div class="category-content" id="category-content"></div>
  </div>

  <script>
    function checkLoginStatus() {
      const isLoggedIn = localStorage.getItem("isLoggedIn");
      const userName = localStorage.getItem("username");
      const userNameElement = document.getElementById("user-name");
      const profileLink = document.getElementById("profile-link");
  
      if (isLoggedIn === "true" && userName) {
        userNameElement.textContent = userName;
        profileLink.href = "hesabim.html";
      } else {
        userNameElement.textContent = "Misafir";
        profileLink.href = "giris-yap.html";
      }
    }
  
    window.onload = checkLoginStatus;
  
    let ilanlarData = [];
    
    if (!localStorage.getItem("ilanlar")) {
      fetch("ilanlar.json")
        .then(res => res.json())
        .then(data => {
          localStorage.setItem("ilanlar", JSON.stringify(data));
          initializeLocalStorage();
        });
    } else {
      initializeLocalStorage();
    }
  
    function initializeLocalStorage() {
      ilanlarData = JSON.parse(localStorage.getItem("ilanlar")) || [];
      renderListings(ilanlarData, document.getElementById("category-content"));
    }
  
    function renderListings(listings, container) {
      container.innerHTML = "";
      listings.forEach(ilan => {
        const ilanDiv = document.createElement("div");
        ilanDiv.className = "ilan";
        ilanDiv.innerHTML = `
          <div class="ilan-card">
            <img src="${ilan.resim}" alt="${ilan.ilanAdi}" class="ilan-image">
            <div class="ilan-bilgi">
              <h3>${ilan.ilanAdi}</h3>
              <p><strong>${ilan.kategori} > ${ilan.altKategori}</strong></p>
              <p>${ilan.detaylar}</p>
              <p class="listing-price">${Number(ilan.fiyat).toLocaleString()} TL</p>
              <button class="detay-btn" onclick="goToDetail(${ilan.id})">Detayları Gör</button>
            </div>
          </div>
        `;
        container.appendChild(ilanDiv);
      });
    }
  
    function goToDetail(id) {
      window.location.href = `ilan-detay.html?id=${id}`;
    }
  
    function searchListings() {
      const searchTerm = document.getElementById("search-input").value.trim().toLowerCase();
      const errorMessage = document.getElementById("error-message");
  
      if (searchTerm.length < 3) {
        if (!errorMessage.classList.contains('shown')) {
          errorMessage.classList.add('shown');
          errorMessage.style.display = "block";
          errorMessage.style.opacity = "1";
          setTimeout(() => errorMessage.style.opacity = "0", 2000);
          setTimeout(() => {
            errorMessage.style.display = "none";
            errorMessage.classList.remove('shown');
          }, 2500);
        }
        return;
      }
  
      const contentDiv = document.getElementById("category-content");
      const filtered = ilanlarData.filter(ilan =>
        ilan.ilanAdi.toLowerCase().includes(searchTerm) ||
        ilan.altKategori.toLowerCase().includes(searchTerm) ||
        ilan.detaylar.toLowerCase().includes(searchTerm) ||
        ilan.fiyat.toString().includes(searchTerm) ||
        ilan.kategori.toLowerCase().includes(searchTerm)
      );
  
      contentDiv.innerHTML = `<h5>Arama Sonuçları: "${searchTerm}"</h5>`;
      if (filtered.length === 0) {
        contentDiv.innerHTML += `<p>Aradığınız kritere uygun ilan bulunamadı.</p>`;
      } else {
        renderListings(filtered, contentDiv);
      }
    }
  
    function handleEnter(event) {
      if (event.key === "Enter") {
        searchListings();
      }
    }
  
    function filterCategory(category) {
      const filtered = ilanlarData.filter(ilan => ilan.kategori === category);
      renderListings(filtered, document.getElementById("category-content"));
    }
  
    function filterSubCategory(subCategory, event) {
      event.stopPropagation();
      const filtered = ilanlarData.filter(ilan => ilan.altKategori === subCategory);
      renderListings(filtered, document.getElementById("category-content"));
    }
  </script>
  
</body>
</html>
